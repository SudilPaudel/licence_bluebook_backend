# Include this inside the nginx `server` block that proxies to the Bluebook API.
# Default nginx limit is 1m, which rejects KYC uploads (2 citizenship photos).
#
# Example:
#   server {
#       listen 443 ssl;
#       server_name api.example.com;
#
#       client_max_body_size 20M;
#       ...
#   }
#
# After updating nginx config:
#   sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 20M;
